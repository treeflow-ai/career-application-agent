<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="white"/>
<style>.b{fill:#f7f7f7;stroke:#222;stroke-width:2;rx:14}.h{font:700 22px Arial,sans-serif;fill:#111}.t{font:16px Arial,sans-serif;fill:#222}.a{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
